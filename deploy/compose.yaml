name: join-meeting
services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-ec", 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/.env}
    ports: ["127.0.0.1:${JOIN_REDIS_PORT:-6387}:6379"]
    volumes: ["redis-data:/data"]
  mailpit:
    image: axllent/mailpit:v1.27.4
    restart: unless-stopped
    ports: ["127.0.0.1:${JOIN_SMTP_PORT:-1027}:1025", "127.0.0.1:${JOIN_MAIL_UI_PORT:-8027}:8025"]
    environment:
      MP_MAX_MESSAGES: 1000
      MP_DATABASE: /data/mailpit.db
    volumes: ["mail-data:/data"]
  livekit:
    # Linux local development: let ICE use host loopback without Docker bridge NAT.
    network_mode: host
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          # Discover host interfaces as well as loopback; do not map every ICE candidate to localhost.
          enable_loopback_candidate: true
          # Firefox hides host IPs behind mDNS names; resolve them so same-machine/LAN guests connect.
          use_mdns: true
        webhook:
          api_key: ${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:8000/api/v1/livekit/webhook
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET}"
volumes:
  redis-data:
  mail-data:
